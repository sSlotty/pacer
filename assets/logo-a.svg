<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F2027"/>
      <stop offset="0.55" stop-color="#113B3A"/>
      <stop offset="1" stop-color="#0B1E2D"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#1ABC9C"/>
      <stop offset="0.6" stop-color="#2ECC71"/>
      <stop offset="1" stop-color="#A3E635"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#E6FFFA"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- progress ring, open at the bottom like a running track -->
  <circle cx="256" cy="256" r="176" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="26"/>
  <circle cx="256" cy="256" r="176" fill="none" stroke="url(#ring)" stroke-width="26"
          stroke-linecap="round" stroke-dasharray="830 276" transform="rotate(128 256 256)"/>

  <!-- pace / heartbeat trace rising to the right -->
  <polyline points="136,286 186,286 214,224 250,318 286,252 318,286 376,286"
            fill="none" stroke="url(#pulse)" stroke-width="26"
            stroke-linecap="round" stroke-linejoin="round"/>

  <!-- runner marker on the ring -->
  <circle cx="256" cy="80" r="30" fill="#0F2027"/>
  <circle cx="256" cy="80" r="19" fill="#A3E635"/>
</svg>
