name: Garmin daily running coach

on:
  schedule:
    # Backup only. The primary trigger is Supabase pg_cron (supabase_dispatch.sql), which
    # dispatches this workflow every 15 minutes 04:00–06:45 Asia/Bangkok until today's summary
    # is sent. GitHub's scheduler runs hours late and skips most firings (CLAUDE.md §12).
    - cron: "17 19-23 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Send now, ignoring the once-a-day and wait-for-sleep-data rules"
        type: boolean
        default: true

permissions:
  contents: read
  actions: write  # keepalive below

concurrency: garmin-daily

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMINTOKENS_BASE64: ${{ secrets.GARMINTOKENS_BASE64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RACES: ${{ vars.RACES }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TRAIL_ELEV_THRESHOLD: ${{ vars.TRAIL_ELEV_THRESHOLD }}
          SEND_DEADLINE: ${{ vars.SEND_DEADLINE }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
        run: |
          # Without Supabase the SQLite file would vanish with the runner and history would never accumulate.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is not set (Supabase Session pooler connection string)"
            exit 1
          fi
          python main.py ${{ github.event_name == 'workflow_dispatch' && inputs.force && '--force' || '' }}

      - name: Keep the schedule alive
        # GitHub disables cron workflows in public repos after 60 days without repo activity,
        # and nothing is committed daily any more. Re-enabling resets that timer.
        if: always() && (github.event_name == 'schedule' || !inputs.force)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily.yml/enable"
