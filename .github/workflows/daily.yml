name: Garmin daily running coach

on:
  schedule:
    # 05:00–06:45 Asia/Bangkok. GitHub delays scheduled runs (often by hours), so the
    # job runs several times and main.py posts once, as soon as Garmin has synced
    # last night's sleep/HRV — and by SEND_DEADLINE at the latest (CLAUDE.md §11.1).
    - cron: "0,30 22-23 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency: garmin-daily

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          GARMINTOKENS_BASE64: ${{ secrets.GARMINTOKENS_BASE64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RACES: ${{ vars.RACES }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TRAIL_ELEV_THRESHOLD: ${{ vars.TRAIL_ELEV_THRESHOLD }}
          SEND_DEADLINE: ${{ vars.SEND_DEADLINE }}
        run: python main.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

      - name: Commit database
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f data/garmin.db ]; then
            git add data/garmin.db
            if ! git diff --cached --quiet; then
              git commit -m "chore: update garmin.db ($(date -u +%F))"
              git push
            fi
          fi
