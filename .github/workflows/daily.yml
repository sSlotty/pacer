name: Garmin daily running coach

on:
  schedule:
    # 02:00–06:45 Asia/Bangkok, every 30 minutes. GitHub's scheduler runs late (1.5–5
    # hours observed) and skips firings, so spread many attempts across the morning;
    # main.py posts exactly once, on the first attempt that has last night's Garmin
    # data, and by SEND_DEADLINE at the latest (CLAUDE.md §11.1).
    - cron: "0,30 19-23 * * *"
    - cron: "45 23 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency: garmin-daily

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily summary
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GARMINTOKENS_BASE64: ${{ secrets.GARMINTOKENS_BASE64 }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RACES: ${{ vars.RACES }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          CLAUDE_MODEL: ${{ vars.CLAUDE_MODEL }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          TRAIL_ELEV_THRESHOLD: ${{ vars.TRAIL_ELEV_THRESHOLD }}
          SEND_DEADLINE: ${{ vars.SEND_DEADLINE }}
          WEATHER_LAT: ${{ vars.WEATHER_LAT }}
          WEATHER_LON: ${{ vars.WEATHER_LON }}
          RUN_TIME: ${{ vars.RUN_TIME }}
        run: |
          # Without Supabase the SQLite file would vanish with the runner and history would never accumulate.
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Secret DATABASE_URL is not set (Supabase Session pooler connection string)"
            exit 1
          fi
          python main.py ${{ github.event_name == 'workflow_dispatch' && '--force' || '' }}

